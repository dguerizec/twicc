[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twicc"
version = "1.8.1"
description = "Claude Code and Codex Web UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Stéphane 'Twidi' Angel", email = "s.angel@twidi.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "apprise~=1.11",
    "blacknoise~=1.2.0",
    "channels~=4.3.2",
    "claude-agent-sdk==0.2.99",
    "cronsim~=2.7",
    "daphne~=4.2.1",
    "django~=6.0.4",
    "httpx~=0.28.1",
    "json-repair~=0.59.5",
    "keyring~=25.7.0; sys_platform == 'darwin'",
    "openai-codex-cli-bin==0.136.0",
    "orjson~=3.11.8",
    "pillow>=12.2.0",
    "psutil~=7.2.2",
    "pydantic>=2.12", # required by the vendored openai_codex SDK
    "python-dotenv~=1.2.2",
    "pyyaml>=6.0",
    "tantivy~=0.25.1",
    "typer~=0.24.1",
    "uvicorn~=0.44.0",
    "watchfiles~=1.1.1",
    "websockets~=16.0",
    "xmltodict~=1.0.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
]

[project.urls]
Homepage = "https://github.com/twidi/twicc"
Repository = "https://github.com/twidi/twicc"
Releases = "https://github.com/twidi/twicc/releases"
"Bug Tracker" = "https://github.com/twidi/twicc/issues"

[project.scripts]
twicc = "twicc:main"

[tool.hatch.build.targets.wheel]
# Two top-level packages ship inside the wheel: the TwiCC app itself, and the
# vendored Codex Python SDK (extracted from openai/codex tag rust-v0.136.0 —
# see hatch_build.py). The SDK is vendored rather than pulled from PyPI
# because the PyPI release `openai-codex` pins an older runtime version and
# we want to ride a known-good combination with the matching upstream tag.
# The Codex CLI binary itself comes from `openai-codex-cli-bin` on PyPI,
# which now publishes manylinux wheels — so TwiCC ships as a single
# platform-agnostic `py3-none-any` wheel again.
packages = ["src/twicc", "src/openai_codex"]
artifacts = [
    "src/twicc/static/frontend/**",
]

[tool.hatch.build.targets.sdist]
# Ship the built frontend assets inside the sdist too, so `pip install` from
# the source distribution does not require npm on the installer's machine.
# The build hook builds them once when producing the sdist; subsequent
# invocations (e.g. building the wheel from the extracted sdist) early-return
# because index.html already exists.
artifacts = [
    "src/twicc/static/frontend/**",
]

# Build hook (hatch_build.py) runs npm ci + npm run build before packaging so
# the wheel and sdist both pick up the built frontend assets.
[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "twicc.settings_test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = "-v"

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "ipython>=9.10.0",
]
