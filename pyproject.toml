[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twicc"
version = "1.5.5"
description = "Claude Code Web UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Stéphane 'Twidi' Angel", email = "s.angel@twidi.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "blacknoise~=1.2.0",
    "channels~=4.3.2",
    "claude-agent-sdk==0.1.71",
    "cronsim~=2.7",
    "daphne~=4.2.1",
    "django~=6.0.4",
    "httpx~=0.28.1",
    "json-repair~=0.59.5",
    "keyring~=25.7.0; sys_platform == 'darwin'",
    "orjson~=3.11.8",
    "psutil~=7.2.2",
    "pydantic>=2.12",  # required by the vendored codex_app_server SDK
    "python-dotenv~=1.2.2",
    "tantivy~=0.25.1",
    "typer~=0.24.1",
    "uvicorn~=0.44.0",
    "watchfiles~=1.1.1",
    "websockets~=16.0",
    "xmltodict~=1.0.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
]

[project.urls]
Homepage = "https://github.com/twidi/twicc"
Repository = "https://github.com/twidi/twicc"
Releases = "https://github.com/twidi/twicc/releases"
"Bug Tracker" = "https://github.com/twidi/twicc/issues"

[project.scripts]
twicc = "twicc:main"

[tool.hatch.build.targets.wheel]
# Two top-level packages ship inside the wheel: the TwiCC app itself, and the
# vendored Codex Python SDK (extracted from openai/codex tag
# rust-v0.131.0-alpha.4 — see hatch_build.py). The SDK is vendored rather than
# pulled from PyPI because its companion runtime `openai-codex-cli-bin` does
# not publish a manylinux wheel (only musllinux), which `uv` refuses to install
# on glibc systems even though the binary itself runs everywhere. We bundle the
# binary directly into our wheel and stamp a regular `linux_*` platform tag.
packages = ["src/twicc", "src/codex_app_server"]
# Gitignored, hook-produced artifact (built frontend). The codex binary that
# lives in src/codex_app_server/_bundled/ is added to the wheel by the build
# hook via build_data["force_include"], precisely targeting the binary for the
# platform currently being built — listing the dir as a glob here would drag
# in stale binaries from previous cross-builds.
artifacts = [
    "src/twicc/static/frontend/**",
]

# Build hook (hatch_build.py) runs npm ci + npm run build before packaging,
# fetches the matching Codex binary for the target platform, and stamps the
# wheel as platform-specific. Applied globally so both sdist and wheel pick up
# the frontend assets; the binary fetch only fires on wheel targets.
[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "twicc.settings_test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = "-v"

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "ipython>=9.10.0",
]
